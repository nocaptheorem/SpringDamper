<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equivalent PD Settling: Linear Mass vs. Torsional Pendulum</title>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Auto-render extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
      onload="renderMathInElement(document.body);"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="timeline-section">
        <div class="btn-group">
            <button id="btnPlay">Pause</button>
            <button id="btnReset" class="secondary">Reset</button>
        </div>
        <div class="timeline-container">
            <div class="timeline-label">
                <span id="timeReadout">t = 0.00s / 60.00s</span>
            </div>
            <input type="range" id="scrubber" min="0" max="1000" value="0">
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="label-row">
                <span class="param-name">Stiffness (k)</span>
                <span class="param-value" id="valKp">10.0</span>
            </div>
            <input type="range" id="sliderKp" min="0" max="150" step="1" value="10">
            <div class="math-badge clickable-equation" id="toggleFp">
              <span>$$F_p = k \cdot (x_{\text{setpoint}} - x_{\text{actual}})$$</span>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span class="param-name">Damping (c)</span>
                <span class="param-value" id="valKd">2.0</span>
            </div>
            <input type="range" id="sliderKd" min="0" max="15" step="0.1" value="2">
            <div class="math-badge clickable-equation" id="toggleFd">
              <span>$$F_d = -c \cdot v_{\text{actual}}$$</span>
            </div>
        </div>

        <div class="header-math-container">
          <div class="math-badge clickable-equation" id="toggleFtotal">
            <span>$$F_{\text{total}} = F_p + F_d$$</span>
            <span>$$\iff$$</span>
            <span>$$\tau_{\text{total}} = \tau_p + \tau_d$$</span>
          </div>
        </div>

        <div class="header-math-container">
          <div class="math-badge clickable-equation" id="toggleVel">
            <span>$$v_{t} = \frac{p_{t} - p_{t-1}}{\Delta t}$$</span>
          </div>
        </div>

    </div>

</div>

<script src="springdamper.js"></script>

</body>
</html>
